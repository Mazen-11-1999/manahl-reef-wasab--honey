<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جميع المنتجات | مناحل ريف وصاب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Cairo:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #120a00;
            --bg-card: #1d1102;
            --bg-accent: #2a1804;
            --gold: #d4af37;
            --gold-light: #f3cf7a;
            --text: #e0c097;
            --text-muted: #9a8b7a;
            --border: rgba(212, 175, 55, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--bg-primary), #1a0f00);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 96px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(145deg, var(--bg-accent), var(--bg-card));
            border-bottom: 2px solid var(--gold);
            padding: 14px 18px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            font-size: 1.15rem;
            color: var(--gold);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            flex-shrink: 0;
            text-decoration: none;
            color: var(--gold);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .back-btn:hover {
            background: var(--gold);
            color: var(--bg-primary);
        }

        .sub {
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px 18px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 18px 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 18px;
        }

        .card {
            background: linear-gradient(145deg, var(--bg-card), var(--bg-accent));
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(212, 175, 55, 0.15);
        }

        .card-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background: #111;
            display: block;
        }

        .card-body {
            padding: 14px 16px 16px;
        }

        .card h2 {
            font-size: 1.05rem;
            color: var(--gold-light);
            margin-bottom: 8px;
            line-height: 1.35;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 8px;
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            margin-bottom: 6px;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold-light);
        }

        .old-price {
            font-size: 0.85rem;
            text-decoration: line-through;
            color: var(--text-muted);
            margin-right: 8px;
        }

        .state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .state i {
            font-size: 2.5rem;
            color: var(--gold);
            opacity: 0.5;
            margin-bottom: 12px;
            display: block;
        }

        .err {
            color: #ff8a8a;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <h1><i class="fas fa-box-open" aria-hidden="true"></i> جميع المنتجات</h1>
            <a href="../index.html" class="back-btn"><i class="fas fa-arrow-right"></i> الرئيسية</a>
        </div>
    </header>
    <p class="sub" id="countLine">جارٍ التحميل…</p>
    <div class="wrap">
        <div id="grid" class="grid" aria-live="polite"></div>
        <div id="empty" class="state" style="display:none;">
            <i class="fas fa-box-open" aria-hidden="true"></i>
            <p>لا توجد منتجات منشورة حالياً.</p>
            <p style="margin-top:8px;font-size:0.85rem;">أضف منتجات من لوحة التحكم ثم حدّث هذه الصفحة.</p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        (async function () {
            const grid = document.getElementById('grid');
            const empty = document.getElementById('empty');
            const countLine = document.getElementById('countLine');

            function esc(s) {
                if (s == null) return '';
                const d = document.createElement('div');
                d.textContent = String(s);
                return d.innerHTML;
            }

            async function loadAllProducts() {
                const limit = 100;
                let page = 1;
                const all = [];
                let safety = 0;
                while (safety < 100) {
                    safety++;
                    const data = await window.API.products.getAll({ page: page, limit: limit });
                    const chunk = data.data || data.products || [];
                    for (let i = 0; i < chunk.length; i++) all.push(chunk[i]);
                    const pag = data.pagination || {};
                    if (!pag.hasNext || chunk.length === 0) break;
                    page++;
                }
                return all;
            }

            try {
                if (!window.API || !window.API.products) {
                    throw new Error('تعذر تحميل واجهة المتجر');
                }
                const products = await loadAllProducts();
                countLine.textContent = products.length
                    ? 'عدد المنتجات المعروضة: ' + products.length
                    : 'لا توجد منتجات';

                if (products.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                grid.innerHTML = products.map(function (p) {
                    const id = p._id || '';
                    const img = (p.image || p.imageUrl || '').trim();
                    const name = p.name || 'منتج';
                    const price = p.price != null ? p.price : '';
                    const old = p.oldPrice;
                    const feat = p.featured ? '<span class="badge">الأكثر طلباً</span>' : '';
                    const sale = p.onSale ? '<span class="badge">خصم خاص</span>' : '';
                    const imgHtml = img
                        ? '<img class="card-img" src="' + esc(img) + '" alt="' + esc(name) + '" loading="lazy" onerror="this.style.display=\'none\'">'
                        : '<div class="card-img" style="display:flex;align-items:center;justify-content:center;font-size:3rem;">🍯</div>';
                    const oldHtml = old && Number(old) > Number(price)
                        ? '<span class="old-price">' + esc(old) + ' ر.س</span>'
                        : '';
                    return (
                        '<a class="card" href="product-details.html?productId=' + esc(id) + '">' +
                        imgHtml +
                        '<div class="card-body">' +
                        feat + sale +
                        '<h2>' + esc(name) + '</h2>' +
                        '<div><span class="price">' + esc(price) + ' ر.س</span>' + oldHtml + '</div>' +
                        '</div></a>'
                    );
                }).join('');
            } catch (e) {
                console.error(e);
                countLine.innerHTML = '<span class="err">تعذر تحميل المنتجات. تأكد من تشغيل السيرفر.</span>';
                empty.style.display = 'block';
                empty.querySelector('p').textContent = (e && e.message) ? e.message : 'حدث خطأ';
            }
        })();
    </script>
</body>

</html>
